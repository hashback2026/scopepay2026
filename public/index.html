<!DOCTYPE html>
<html>
<head>
  <title>Bulk STK Push</title>
</head>
<body>
  <h2>ScopePay Bulk STK Push</h2>

  <label>Amount:</label><br>
  <input type="number" id="amount" /><br><br>

  <label>Reference:</label><br>
  <input type="text" id="reference" /><br><br>

  <label>Phone Numbers (one per line):</label><br>
  <textarea id="numbers" rows="10" cols="30"></textarea><br><br>

  <button onclick="sendPayments()">Send STK Push</button>

  <pre id="result"></pre>

  <script>
    async function sendPayments() {
      const amount = document.getElementById("amount").value;
      const reference = document.getElementById("reference").value;
      const numbersText = document.getElementById("numbers").value;

      const numbers = numbersText.split("\n").map(n => n.trim()).filter(n => n);

      const res = await fetch("/send-bulk", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ numbers, amount, reference })
      });

      const data = await res.json();
      document.getElementById("result").innerText = JSON.stringify(data, null, 2);
    }
  </script>
</body>
</html>
